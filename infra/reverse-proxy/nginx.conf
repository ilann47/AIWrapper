server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://api:8080/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_buffering off; }
  location /v1/ { proxy_pass http://api:8080/v1/; proxy_http_version 1.1; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $request_id; proxy_buffering off; proxy_read_timeout 600s; }
  location / { try_files $uri /index.html; }
}
