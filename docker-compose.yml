services:
  # Full lidge-jun/OpenCodex runtime and its imported GUI.
  opencodex:
    build: { context: ., dockerfile: Dockerfile.opencodex }
    environment:
      OPENCODEX_API_AUTH_TOKEN: ${OPENCODEX_API_AUTH_TOKEN:?Set OPENCODEX_API_AUTH_TOKEN in .env}
    ports: ["127.0.0.1:8765:8765"]
    volumes:
      - type: bind
        source: ${CODEX_HOST_HOME:-C:/Users/Public/.codex}
        target: /home/bun/.codex
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8765/healthz');if(!r.ok)process.exit(1);const j=await r.json();if(j.service!=='opencodex')process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # circlemouth/Codex-Wrapper with thin AIWrapper integration adapters.
  codex-wrapper:
    build: { context: ., dockerfile: Dockerfile.codex-wrapper }
    environment:
      CODEX_CONFIG_DIR: /home/codex/.codex
      CODEX_WORKDIR: /workspace
      CODEX_PATH: codex
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-medium}
      CODEX_MAX_PARALLEL_REQUESTS: ${CODEX_MAX_PARALLEL_REQUESTS:-2}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AIWRAPPER_STATE_DIR: /data
      AIWRAPPER_DATABASE_PATH: /data/aiwrapper.db
      AIWRAPPER_MULTI_AUTH_DIR: /data/multi-auth
      AIWRAPPER_GOVERNANCE_BRIDGE: /opt/aiwrapper/extensions/aiwrapper-admin/src/governance-bridge.mjs
      AIWRAPPER_NINE_ROUTER_BRIDGE: /opt/aiwrapper/extensions/aiwrapper-runtime/src/nine-router-bridge.mjs
      AIWRAPPER_PROFILE_SCRIPT: /opt/aiwrapper/packages/codex-profiles/bin/codex-profile
      AIWRAPPER_PROFILE_BASH: /bin/bash
      AIWRAPPER_OWNER_NAME: ${AIWRAPPER_OWNER_NAME:-owner}
      AIWRAPPER_OWNER_KEY: ${AIWRAPPER_OWNER_KEY:-}
      AIWRAPPER_PUBLIC_BASE_URL: http://127.0.0.1:8766
      AIWRAPPER_EXECUTION_BACKEND: opencodex
      AIWRAPPER_OPENCODEX_BASE_URL: http://opencodex:8765
      AIWRAPPER_OPENCODEX_API_KEY: ${OPENCODEX_API_AUTH_TOKEN:?Set OPENCODEX_API_AUTH_TOKEN in .env}
      AIWRAPPER_CORS_ORIGINS: http://127.0.0.1:8765,http://localhost:8765
    ports: ["127.0.0.1:8766:8766"]
    volumes:
      - type: bind
        source: ${CODEX_HOST_HOME:-C:/Users/Public/.codex}
        target: /home/codex/.codex
        read_only: true
      - aiwrapper_data:/data
      - codex_workspace:/workspace
    depends_on:
      opencodex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; j=json.load(urllib.request.urlopen('http://127.0.0.1:8766/health/ready',timeout=4)); assert j['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  aiwrapper_data: {}
  codex_workspace: {}
